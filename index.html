<style>
  :root{
    --bg: #0E1712;
    --panel: #15251C;
    --panel-2: #1B3226;
    --line: #294A38;
    --text: #E7EDF3;
    --text-dim: #8FA3B3;
    --accent: #2E9E6B;
    --accent-2: #1F7A52;
    --warn: #E0A93E;
    --ok: #4FAE8A;
    --danger: #D9695F;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:100px;}

  header{
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    margin:0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  header p{
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  .summary{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 16px 20px;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .card .label{
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .card .value{
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
  }
  .card.wide{ grid-column: 1 / -1; }
  .card .value.small{ font-size: 15px; font-weight: 600; }

  .section-title{
    padding: 4px 20px 8px;
    font-size: 13px;
    color: var(--text-dim);
    display:flex;
    justify-content: space-between;
    align-items:center;
  }

  .list{
    padding: 0 20px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .trip{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    position: relative;
  }
  .trip.paga{ opacity: 0.55; }
  .trip-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 10px;
  }
  .trip-dest{
    font-weight: 700;
    font-size: 16px;
  }
  .trip-date{
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 2px;
  }
  .trip-value{
    font-weight: 700;
    font-size: 17px;
    white-space:nowrap;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-size: 11px;
    padding: 3px 10px 3px 8px;
    border-radius: 20px;
    margin-top: 8px;
    font-weight: 600;
  }
  .badge .dot{

const STORAGE_KEY = "controle_viagens_dados";
let trips = [];
let editingId = null;

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    trips = raw ? JSON.parse(raw) : [];
  }catch(e){ trips = []; }
}
function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(trips));
}

function fmtMoney(v){
  if(valoresOcultos) return "R$ ••••••";
  return "R$ " + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

let valoresOcultos = false;
try{
  valoresOcultos = localStorage.getItem('valores_ocultos') === '1';
}catch(e){ valoresOcultos = false; }

function alternarValoresOcultos(){
  valoresOcultos = !valoresOcultos;
  try{ localStorage.setItem('valores_ocultos', valoresOcultos ? '1' : '0'); }catch(e){}
  const btn = document.getElementById('btnOlho');
  if(btn) btn.textContent = valoresOcultos ? "🔒" : "🔓";
  render();
}

function fmtDate(d){
  if(!d) return "";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function atualizarFaltante(){
  const total = parseFloat(document.getElementById('fValorTotal').value) || 0;
  const pago = parseFloat(document.getElementById('fValorPago').value) || 0;
  const faltante = Math.max(total - pago, 0);
  document.getElementById('fFaltante').value = fmtMoney(faltante);
}

function openModal(id){
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? "Editar viagem" : "Nova viagem";
  if(id){
    const t = trips.find(x=>x.id===id);
    document.getElementById('fNome').value = t.nome;
    document.getElementById('fCidade').value = t.cidade || "";
    document.getElementById('fHotel').value = t.hotel || "";
    document.getElementById('fDataInicioPagamento').value = t.dataInicioPagamento || "";
    document.getElementById('fData').value = t.data;
    document.getElementById('fValorTotal').value = t.valorTotal;
    document.getElementById('fValorPago').value = t.valorPago;
    document.getElementById('fVenc').value = t.venc || "";
    document.getElementById('fObs').value = t.obs || "";
  } else {
    document.getElementById('fNome').value = "";
    document.getElementById('fCidade').value = "";
    document.getElementById('fHotel').value = "";
    document.getElementById('fDataInicioPagamento').value = "";
    document.getElementById('fData').value = "";
    document.getElementById('fValorTotal').value = "";
    document.getElementById('fValorPago').value = "";
    document.getElementById('fVenc').value = "";
    document.getElementById('fObs').value = "";
  }
  atualizarFaltante();
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
}

function saveTrip(){
  const nome = document.getElementById('fNome').value.trim();
  const cidade = document.getElementById('fCidade').value.trim();
  const hotel = document.getElementById('fHotel').value.trim();
  const dataInicioPagamento = document.getElementById('fDataInicioPagamento').value;
  const data = document.getElementById('fData').value;
  const valorTotal = parseFloat(document.getElementById('fValorTotal').value) || 0;
  const valorPago = parseFloat(document.getElementById('fValorPago').value) || 0;
  const venc = document.getElementById('fVenc').value;
  const obs = document.getElementById('fObs').value.trim();

  if(!nome || !data){
    alert("Preencha ao menos o nome da viagem e a data.");
    return;
  }

  salvarCidadeSeNova(cidade);
  salvarHotelSeNovo(hotel);

  if(editingId){
    const t = trips.find(x=>x.id===editingId);
    t.nome = nome; t.cidade = cidade; t.hotel = hotel; t.dataInicioPagamento = dataInicioPagamento; t.data = data;
    t.valorTotal = valorTotal; t.valorPago = valorPago;
    t.venc = venc; t.obs = obs;
    if(valorPago >= valorTotal && valorTotal > 0) t.status = "paga";
    else t.status = "pagar";
  } else {
    trips.push({
      id: Date.now().toString(),
      nome, cidade, hotel, dataInicioPagamento, data, valorTotal, valorPago, venc, obs,
      status: (valorPago >= valorTotal && valorTotal > 0) ? "paga" : "pagar"
    });
  }
  persist();
  closeModal();
  render();
}

function togglePago(id){
  const t = trips.find(x=>x.id===id);
  if(t.status === "pagar"){
    t.status = "paga";
    t.valorPago = t.valorTotal;
  } else {
    t.status = "pagar";
  }
  persist();
  render();
}

function deleteTrip(id){
  if(!confirm("Excluir esta viagem?")) return;
  trips = trips.filter(x=>x.id!==id);
  persist();
  render();
}

function gerarLembrete(id){
  try{
  const t = trips.find(x=>x.id===id);
  if(!t) return;

  const dataViagem = t.data.replace(/-/g,""); // YYYYMMDD
  const [ano, mes, dia] = t.data.split("-").map(Number);
  const dataFimObj = new Date(ano, mes-1, dia+1);
  const dataFim = dataFimObj.getFullYear().toString()
    + String(dataFimObj.getMonth()+1).padStart(2,'0')
    + String(dataFimObj.getDate()).padStart(2,'0');

  const titulo = t.cidade ? `Viagem: ${t.nome} - ${t.cidade}` : `Viagem: ${t.nome}`;
  const descricao = `Valor total: ${fmtMoney(t.valorTotal)}. Falta pagar: ${fmtMoney(Math.max(t.valorTotal - t.valorPago,0))}.`;
  const agora = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  const uid = "viagem-" + t.id + "@controle-viagens";

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Controle de Viagens//PT-BR",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + uid,
    "DTSTAMP:" + agora,
    "DTSTART;VALUE=DATE:" + dataViagem,
    "DTEND;VALUE=DATE:" + dataFim,
    "SUMMARY:" + titulo,
    "DESCRIPTION:" + descricao,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    "DESCRIPTION:Sua viagem está chegando",
    "TRIGGER:-P7D",
    "END:VALARM",
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    "DESCRIPTION:Sua viagem é amanhã",
    "TRIGGER:-P1D",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const dataUri = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  const link = document.createElement('a');
  link.href = dataUri;
  link.download = "lembrete-viagem.ics";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  }catch(e){
    alert("Não foi possível criar o lembrete aqui na prévia. Abra o app pelo ícone salvo na tela inicial do celular e tente de novo por lá.");
  }
}

function getBadge(t){
  if(t.status === "paga") return {cls:"paga", label:"Paga"};
  if(t.venc && t.venc < todayStr()) return {cls:"atrasada", label:"Atrasada"};
  return {cls:"pagar", label:"A pagar"};
}

function render(){
  const sorted = [...trips].sort((a,b)=> a.data.localeCompare(b.data));

  // Summary
  const totalViagens = trips.length;
  const totalGeral = trips.reduce((s,t)=>s+t.valorTotal,0);
  const totalFaltante = trips.reduce((s,t)=>s + Math.max(t.valorTotal - t.valorPago, 0), 0);
  const proxima = sorted.filter(t=>t.data >= todayStr())[0];

  document.getElementById('summary').innerHTML = `
    <div class="card">
      <div class="label">Viagens cadastradas</div>
      <div class="value">${totalViagens}</div>
    </div>
    <div class="card">
      <div class="label">Valor total geral</div>
      <div class="value">${fmtMoney(totalGeral)}</div>
    </div>
    <div class="card">
      <div class="label">Falta pagar (total)</div>
      <div class="value">${fmtMoney(totalFaltante)}</div>
    </div>
    <div class="card">
      <div class="label">Próxima viagem</div>
      <div class="value small">${proxima ? (proxima.cidade || proxima.nome) : "Nenhuma"}</div>
    </div>
  `;

  // List
  const listEl = document.getElementById('list');
  if(sorted.length === 0){
    listEl.innerHTML = `<div class="empty">Nenhuma viagem cadastrada ainda.<br>Toque no + para adicionar.</div>`;
    return;
  }

  listEl.innerHTML = sorted.map(t=>{
    const badge = getBadge(t);
    const faltante = Math.max(t.valorTotal - t.valorPago, 0);
    const nomeExibido = (t.hotel && t.hotel === t.nome) ? `🏨 ${t.nome}` : t.nome;
    const subtitulo = t.cidade ? `${nomeExibido} · ${t.cidade}` : nomeExibido;
    return `
      <div class="trip ${t.status==='paga' ? 'paga' : ''}">
        <div class="trip-top">
          <div>
            <div class="trip-dest">${subtitulo}</div>
            ${(t.hotel && t.hotel !== t.nome) ? `<div class="trip-date">🏨 ${t.hotel}</div>` : ""}
            <div class="trip-date">${t.dataInicioPagamento ? "Começou a pagar em " + fmtDate(t.dataInicioPagamento) + " · " : ""}Viagem em ${fmtDate(t.data)}${t.venc ? " · vence " + fmtDate(t.venc) : ""}</div>
          </div>
          <div class="trip-value">${fmtMoney(t.valorTotal)}</div>
        </div>
        <div class="trip-obs" style="border-top:none; padding-top:0; margin-top:8px;">
          Pago: ${fmtMoney(t.valorPago)} &nbsp;·&nbsp; Falta: ${fmtMoney(faltante)}
        </div>
        <span class="badge ${badge.cls}"><span class="dot"></span>${badge.label}</span>
        ${t.obs ? `<div class="trip-obs">${t.obs}</div>` : ""}
        <div class="trip-actions">
          <button onclick="openModal('${t.id}')">Editar</button>
          <button class="pay" onclick="togglePago('${t.id}')">${t.status==='paga' ? 'Reabrir' : 'Marcar paga'}</button>
          <button class="del" onclick="deleteTrip('${t.id}')">Excluir</button>
        </div>
        <div class="trip-actions" style="margin-top:8px;">
          <button onclick="gerarLembrete('${t.id}')">🔔 Criar lembrete no Calendário</button>
        </div>
      </div>
    `;
  }).join("");
}


let timeoutBuscaHotel = null;
function buscarHoteis(){
  // Sempre mostra primeiro os hotéis já visitados que combinam com o que foi digitado
  popularHoteis();

  clearTimeout(timeoutBuscaHotel);
  timeoutBuscaHotel = setTimeout(async () => {
    try{
      const termo = document.getElementById('fHotel').value.trim();
      const cidade = document.getElementById('fCidade').value.trim();
      if(termo.length < 3) return;

      const query = encodeURIComponent(`${termo} hotel ${cidade}`.trim());
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&q=${query}`);
      const dados = await resp.json();

      const visitados = getHoteisVisitados();
      const dl = document.getElementById('listaHoteis');
      const opcoesOnline = dados.map(d => d.display_name.split(',')[0]);
      const todasOpcoes = [...new Set([...visitados, ...opcoesOnline])];
      dl.innerHTML = todasOpcoes.map(h => `<option value="${h}"></option>`).join("");
    }catch(e){
      // Sem internet ou API fora do ar: as sugestões dos hotéis visitados continuam disponíveis
    }
  }, 600);
}

function getHoteisVisitados(){
  try{
    return JSON.parse(localStorage.getItem('hoteis_visitados') || '[]');
  }catch(e){ return []; }
}

function popularHoteis(){
  const dl = document.getElementById('listaHoteis');
  const visitados = getHoteisVisitados();
  dl.innerHTML = visitados.map(h => `<option value="${h}"></option>`).join("");
}

function salvarHotelSeNovo(hotel){
  if(!hotel) return;
  const visitados = getHoteisVisitados();
  if(!visitados.includes(hotel)){
    visitados.push(hotel);
    localStorage.setItem('hoteis_visitados', JSON.stringify(visitados));
  }
}

function popularCidades(){
  const dl = document.getElementById('listaCidades');
  let extras = [];
  try{
    extras = JSON.parse(localStorage.getItem('cidades_extra') || '[]');
  }catch(e){ extras = []; }
  const todas = [...CIDADES_BR, ...extras];
  dl.innerHTML = todas.map(c => `<option value="${c}"></option>`).join("");
}

function salvarCidadeSeNova(cidade){
  if(!cidade) return;
  let extras = [];
  try{
    extras = JSON.parse(localStorage.getItem('cidades_extra') || '[]');
  }catch(e){ extras = []; }
  const jaExiste = CIDADES_BR.includes(cidade) || extras.includes(cidade);
  if(!jaExiste){
    extras.push(cidade);
    localStorage.setItem('cidades_extra', JSON.stringify(extras));
    popularCidades();
  }
}

function atualizarFaltanteRapido(){
  const total = parseFloat(document.getElementById('qValorTotal').value) || 0;
  const pago = parseFloat(document.getElementById('qValorPago').value) || 0;
  const faltante = Math.max(total - pago, 0);
  document.getElementById('qFaltanteInfo').textContent = "Falta pagar: " + fmtMoney(faltante);
}

let timeoutBuscaHotelRapido = null;
function buscarHoteisRapido(){
  popularHoteis();
  clearTimeout(timeoutBuscaHotelRapido);
  timeoutBuscaHotelRapido = setTimeout(async () => {
    try{
      const termo = document.getElementById('qHotel').value.trim();
      const cidade = document.getElementById('qCidade').value.trim();
      if(termo.length < 3) return;
      const query = encodeURIComponent(`${termo} hotel ${cidade}`.trim());
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&q=${query}`);
      const dados = await resp.json();
      const visitados = getHoteisVisitados();
      const dl = document.getElementById('listaHoteis');
      const opcoesOnline = dados.map(d => d.display_name.split(',')[0]);
      const todasOpcoes = [...new Set([...visitados, ...opcoesOnline])];
      dl.innerHTML = todasOpcoes.map(h => `<option value="${h}"></option>`).join("");
    }catch(e){
      // sem internet: sugestões locais continuam disponíveis
    }
  }, 600);
}

function salvarViagemRapida(){
  try{
    const cidade = document.getElementById('qCidade').value.trim();
    const hotel = document.getElementById('qHotel').value.trim();
    const data = document.getElementById('qData').value;
    const valorTotal = parseFloat(document.getElementById('qValorTotal').value) || 0;
    const valorPago = parseFloat(document.getElementById('qValorPago').value) || 0;

    if((!hotel && !cidade) || !data){
      alert("Preencha ao menos o hotel (ou a cidade) e a data.");
      return;
    }

    const nome = hotel || cidade;

    salvarCidadeSeNova(cidade);
    salvarHotelSeNovo(hotel);

    trips.push({
      id: Date.now().toString(),
      nome, cidade, hotel, dataInicioPagamento: "", data, valorTotal, valorPago, venc: "", obs: "",
      status: (valorPago >= valorTotal && valorTotal > 0) ? "paga" : "pagar"
    });
    persist();

    document.getElementById('qCidade').value = "";
    document.getElementById('qHotel').value = "";
    document.getElementById('qData').value = "";
    document.getElementById('qValorTotal').value = "";
    document.getElementById('qValorPago').value = "";
    document.getElementById('qFaltanteInfo').textContent = "Falta pagar: R$ 0,00";

    render();
  }catch(e){
    alert("Não foi possível salvar. Tente novamente.");
  }
}

popularCidades();
popularHoteis();
load();
{
  const btn = document.getElementById('btnOlho');
  if(btn) btn.textContent = valoresOcultos ? "🔒" : "🔓";
}
render();
</script>
